services:
  postgres:
    image: postgres:16-alpine
    container_name: cotizaciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cotizaciones}
      POSTGRES_USER: ${POSTGRES_USER:-cotizaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en el .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET en el .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AI_ASSISTANT_MODEL: ${ANTHROPIC_AI_ASSISTANT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AI_ASSISTANT_MODEL: ${OPENAI_AI_ASSISTANT_MODEL:-}
      PORT: 5001
    ports:
      - "5001:5001"

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    ports:
      - "3002:3000"

volumes:
  postgres_data:
